services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ai_fintech_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d ai_fintech_db
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: >-
        postgresql+psycopg2://postgres:password@db:5432/ai_fintech_db
      SECRET_KEY: docker-development-secret-key-change-before-production
      ENVIRONMENT: development
      DEBUG: "false"
      CREATE_DATABASE_TABLES: "false"
      ALLOWED_ORIGINS: >-
        ["http://localhost:5173","http://localhost:5174"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data = json.load(urllib.request.urlopen(
          'http://localhost:8000/health', timeout=5));
          raise SystemExit(
          0 if data.get('status') == 'healthy'
          and data.get('database') == 'healthy' else 1)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  fraud-frontend:
    build:
      context: ./frontend-fraud
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost/
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  resume-frontend:
    build:
      context: ./frontend-resume
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost/
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
